name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Actions are on floating major tags; dependabot (.github/dependabot.yml) opens
# the bump PRs. The workflow holds no secrets and the token is read-only, which
# is what keeps that acceptable — see L-17 in docs/audit-2026-08-22.md.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  helper:
    name: Helper — format, lint, race tests, install layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Format and lint
        run: make lint-go

      - name: Install D-Bus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus

      - name: Tests with race detector
        run: dbus-run-session -- go test -race ./...

      - name: Build
        run: make build

      - name: Install layout
        run: make test-install

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  plasmoid:
    name: Plasmoid — logic tests and QML lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Qt QML tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-declarative-dev-tools \
            qml6-module-qtcore \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qttest

      - name: Logic tests
        run: make test-plasmoid

      - name: QML lint
        run: make lint-qml

  hygiene:
    name: Shell scripts and REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell scripts
        run: make lint-sh

      - name: REUSE compliance
        run: pipx run reuse lint
