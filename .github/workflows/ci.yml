name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Actions are on floating major tags; dependabot (.github/dependabot.yml) opens
# the bump PRs. The workflow holds no secrets and the token is read-only, which
# is what keeps that acceptable — see L-17 in docs/audit-2026-08-22.md.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  helper:
    name: Helper — format, lint, race tests, install layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Format and lint
        run: make lint-go

      - name: Install D-Bus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus

      - name: Tests with race detector
        run: dbus-run-session -- go test -race ./...

      - name: Build
        run: make build

      - name: Install layout
        run: make test-install

      - name: Vulnerability scan
        # govulncheck is a tool, not a build dependency, so it may use a newer
        # toolchain than the module targets. actions/setup-go pins
        # GOTOOLCHAIN=local to the go.mod version, and x/vuln has required Go
        # 1.25 since v1.2.0 — so when go.mod trailed far enough behind, the scan
        # stopped running at all rather than reporting anything. GOTOOLCHAIN=auto
        # lets `go run` fetch what the tool asks for and keeps that failure mode
        # from coming back; every other step still builds on the go.mod version.
        #
        # Note this does not decide what gets scanned. govulncheck reports the
        # standard library of the toolchain the module builds with, so a stale
        # `go` directive shows up here as real findings, not as a tooling error.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  plasmoid:
    name: Plasmoid — logic tests and QML lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The D-Bus harness (tests/plasmoid/qml-dbus) builds a stub helper and
      # starts a private bus before it can decide whether it can run. Neither is
      # here for its own sake: the suite itself always skips in CI, because
      # org.kde.plasma.workspace.dbus is a Plasma 6 module and pulling KDE in to
      # run it would be a bad trade. What this buys is that everything up to
      # that skip — the stub building, taking the bus name, and the runner being
      # invoked — is exercised on every PR instead of only on a KDE desktop.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Qt QML tooling and D-Bus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            dbus \
            qt6-declarative-dev-tools \
            qml6-module-qtcore \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qttest

      - name: Logic tests
        run: make test-plasmoid

      - name: QML lint
        run: make lint-qml

  hygiene:
    name: Shell scripts and REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell scripts
        run: make lint-sh

      - name: REUSE compliance
        run: pipx run reuse lint
